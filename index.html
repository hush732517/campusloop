<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1D4ED8">
  <meta name="description" content="校园圈 CampusLoop —— 把多来源校园活动与机会翻译成新生看得懂、来得及、用得对的信息站。">
  <title>校园圈 CampusLoop · 校园活动与机会</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231D4ED8'/><text x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>圈</text></svg>">
</head>
<body>
  <a class="sr-only" href="#main">跳到主要内容</a>

  <!-- ============================ 顶部栏 ============================ -->
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <span class="brand__logo" aria-hidden="true">圈</span>
        <span>
          <span class="brand__name">校园圈 CampusLoop</span>
          <span class="brand__sub" id="brandSub">校园机会，看得懂、来得及、用得对</span>
        </span>
      </div>
      <span class="topbar__spacer"></span>
      <span id="todayChipSlot"></span>
      <button class="icon-btn" id="btnClock" title="切换时间基准，用于验证不同时点的状态计算" aria-label="时间基准设置">🕒</button>
      <button class="icon-btn" id="btnAbout" title="关于本产品与数据说明" aria-label="关于本产品">?</button>
    </div>
  </header>

  <!-- ============================ 主内容 ============================ -->
  <main class="app" id="main" tabindex="-1">
    <div id="view" class="view" aria-live="polite"></div>
  </main>

  <!-- ============================ 底部导航 ============================ -->
  <nav class="tabbar" aria-label="主导航">
    <div class="tabbar__inner" id="tabbar"></div>
  </nav>

  <script type="module" src="scripts/main.js"></script>
  <noscript>
    <p style="padding:24px;text-align:center">本作品需要启用 JavaScript 才能运行。</p>
  </noscript>
</body>
</html>
